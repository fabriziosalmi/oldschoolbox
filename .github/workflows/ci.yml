name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-probe:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build probes and plugin
        run: cmake --build build -j4 --target state_probe acid303_probe kick_probe hats_probe aa_probe master_output_probe OldSchoolBox_VST3 OldSchoolBox_AU OldSchoolBox_Standalone

      - name: Run verification probes
        run: |
          ./build/state_probe
          ./build/acid303_probe
          ./build/kick_probe
          ./build/hats_probe
          ./build/aa_probe
          ./build/master_output_probe
